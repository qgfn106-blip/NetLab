<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netlab · 浏览器内仿真</title>
<style>
  :root{
    --ink:#1d1f1e; --muted:#5d6661; --paper:#f6f5f1; --card:#fffefb;
    --line:#d8d5cc; --accent:#0f7a63; --accent-2:#3b6ea8; --warn:#a4541f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:14px/1.6 "Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
  header{padding:22px 28px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;letter-spacing:.02em}
  h1 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
  main{max-width:1040px;margin:0 auto;padding:18px 28px 40px}
  .status{display:flex;gap:10px;align-items:center;color:var(--muted);
    font-size:13px;margin:4px 0 14px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .dot.ok{background:var(--accent)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px}
  canvas{display:block;width:100%;height:340px}
  .legend{display:flex;gap:18px;align-items:center;padding:10px 14px 2px;
    color:var(--muted);font-size:12.5px}
  .swatch{display:inline-block;width:18px;height:3px;border-radius:2px;
    vertical-align:middle;margin-right:6px}
  .meta{display:flex;gap:22px;flex-wrap:wrap;padding:10px 14px 0;color:var(--muted);
    font-size:12.5px}
  .meta b{color:var(--ink);font-weight:600}
  code{background:#efeee8;padding:1px 5px;border-radius:4px;font-size:12px}
  .err{color:var(--warn);white-space:pre-wrap}
  footer{color:var(--muted);font-size:12px;padding:10px 28px 26px}
</style>
</head>
<body>
<header>
  <h1>Netlab <small>浏览器内仿真 · Pyodide / WebAssembly</small></h1>
</header>
<main>
  <div class="status"><span class="dot" id="dot"></span><span id="status">正在加载 Pyodide…</span></div>
  <div class="panel">
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><i class="swatch" style="background:#8a97a6"></i>Vin（源电压）</span>
      <span><i class="swatch" style="background:#0f7a63"></i>Vout（R–C 中点）</span>
    </div>
    <div class="meta">
      <span>电路 <b>R 1 kΩ / C 100 nF</b></span>
      <span>输入 <b>1 kHz · 1 V</b></span>
      <span>步长 <b>dt = 5 µs</b></span>
      <span id="metrics"></span>
    </div>
  </div>
</main>
<footer>核心求解器在浏览器里由 CPython（Pyodide）直接执行，没有后端服务器；数据不出本机。</footer>

<script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
<script>
const statusEl = document.getElementById("status");
const dot = document.getElementById("dot");
const metricsEl = document.getElementById("metrics");

function setStatus(text, ok) {
  statusEl.textContent = text;
  dot.classList.toggle("ok", !!ok);
}

function draw(payload) {
  const canvas = document.getElementById("chart");
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = rect.width, H = rect.height;
  const m = {l: 52, r: 14, t: 14, b: 30};
  ctx.clearRect(0, 0, W, H);

  const t = payload.t, vin = payload.vin, vout = payload.vout;
  const xMax = t[t.length - 1] || 1;
  let lo = Math.min(...vin, ...vout), hi = Math.max(...vin, ...vout);
  const pad = (hi - lo) * 0.12 || 0.1;
  lo -= pad; hi += pad;

  const X = v => m.l + (v / xMax) * (W - m.l - m.r);
  const Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);

  // 网格
  ctx.strokeStyle = "#e6e3da";
  ctx.lineWidth = 1;
  ctx.font = "11px Segoe UI, sans-serif";
  ctx.fillStyle = "#7c857f";
  const xTicks = 5, yTicks = 5;
  for (let i = 0; i <= xTicks; i++) {
    const v = xMax * i / xTicks, x = X(v);
    ctx.beginPath(); ctx.moveTo(x, m.t); ctx.lineTo(x, H - m.b); ctx.stroke();
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.fillText((v * 1000).toFixed(1) + " ms", x, H - m.b + 7);
  }
  for (let i = 0; i <= yTicks; i++) {
    const v = lo + (hi - lo) * i / yTicks, y = Y(v);
    ctx.beginPath(); ctx.moveTo(m.l, y); ctx.lineTo(W - m.r, y); ctx.stroke();
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(v.toFixed(2) + " V", m.l - 7, y);
  }

  const line = (arr, color, width) => {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = "round";
    for (let i = 0; i < arr.length; i++) {
      const x = X(t[i]), y = Y(arr[i]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  };
  line(vin, "#8a97a6", 1.2);
  line(vout, "#0f7a63", 1.8);
}

async function main() {
  try {
    setStatus("正在加载 Pyodide（首次约 10 MB）…");
    const pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.28.3/full/",
    });

    setStatus("正在加载 numpy…");
    await pyodide.loadPackage("numpy");

    setStatus("正在解包 netlab 引擎…");
    const zipBytes = new Uint8Array(await (await fetch("netlab.zip")).arrayBuffer());
    pyodide.FS.writeFile("/tmp/netlab.zip", zipBytes);
    pyodide.runPython(`
import sys, zipfile
zipfile.ZipFile("/tmp/netlab.zip").extractall("/tmp")
sys.path.insert(0, "/tmp")
`);

    setStatus("正在执行演示电路（2000 步）…");
    pyodide.runPython(await (await fetch("demo.py")).text());
    const runDemo = pyodide.globals.get("run_demo");
    const started = performance.now();
    const json = runDemo();
    const elapsed = performance.now() - started;
    const payload = JSON.parse(json);
    runDemo.destroy && runDemo.destroy();

    draw(payload);
    metricsEl.innerHTML =
      "仿真步数 <b>" + payload.steps + "</b> · 计算耗时 <b>" +
      elapsed.toFixed(0) + " ms</b> · 采样点 <b>" + payload.t.length + "</b>";
    setStatus("完成：仿真在浏览器内运行，无后端参与。", true);
  } catch (err) {
    console.error(err);
    setStatus("加载失败：" + (err && err.message ? err.message : err), false);
    document.getElementById("chart").outerHTML =
      '<pre class="err">' + String(err && err.stack || err) + "</pre>";
  }
}

main();
</script>
</body>
</html>
