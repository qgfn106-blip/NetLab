<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Netlab signal-flow evaluation</title><desc id="desc">Delayed edges are evaluated first, followed by topological node evaluation and recording.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="960" height="420" fill="#f8fafc"/><text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">ΦΔt：一拍信号流求值</text>
<g font-family="sans-serif"><rect x="45" y="145" width="175" height="82" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="73" y="180" font-size="18" font-weight="700" fill="#92400e">快照</text><text x="73" y="205" font-size="15" fill="#451a03">stateₖ, dataₖ</text>
<rect x="285" y="145" width="175" height="82" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="309" y="180" font-size="18" font-weight="700" fill="#991b1b">延迟边</text><text x="309" y="205" font-size="15" fill="#450a0a">先算 z⁻¹</text>
<rect x="525" y="145" width="175" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="554" y="180" font-size="18" font-weight="700" fill="#1e3a8a">拓扑序</text><text x="554" y="205" font-size="15" fill="#172554">gₑ → fᵥ</text>
<rect x="765" y="145" width="150" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="795" y="180" font-size="18" font-weight="700" fill="#166534">提交</text><text x="795" y="205" font-size="15" fill="#14532d">time += dt</text>
