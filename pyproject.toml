[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab"
dynamic = ["version"]
description = "Netlab: node-and-connection network simulation and engineering solver"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.10,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]
# PlotKit 是可选外部绘图依赖（C-4 契约）：版本区间锁死，缺失时 netlab 降级运行。
plotkit = [
    "plotkit>=0.2,<0.3",
]
desktop = [
    "pywebview>=4.0",
    "pythonnet>=3.0",
    "PySide6>=6.6,<7.0",
]

[tool.setuptools.dynamic]
version = { attr = "netlab.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["netlab*"]
