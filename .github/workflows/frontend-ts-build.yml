name: frontend-ts-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python (evidence)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck (strict, no emit)
        working-directory: frontend
        run: npm run typecheck

      - name: Build (tsc-typed TS -> committed JS artifacts)
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Verify app.ts split parity
        working-directory: frontend
        run: npm run verify:parity

      - name: Section budget (strict audit P0)
        working-directory: frontend
        run: npm run check:sections

      - name: Artifact drift guard (committed JS must match a fresh build)
        working-directory: frontend
        run: git diff --ignore-cr-at-eol --exit-code -- app.js app.utils.js desktop-shim.js app

      - name: Record build evidence
        run: >
          mkdir -p reports/evidence &&
          python tools/run_evidence.py --tool frontend-ts-build
          --out reports/evidence/frontend-ts-build.json
          --artifact frontend/package-lock.json --artifact frontend/app.js --artifact frontend/app.utils.js
          -- npm --prefix frontend run typecheck

      - name: Upload CI evidence (run id + exact SHA + artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ts-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/evidence/
          if-no-files-found: warn
          retention-days: 14

  e2e-l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright-core install --with-deps chromium

      - name: Install server deps
        run: pip install fastapi uvicorn numpy scipy jsonschema

      - name: L1 browser e2e
        working-directory: .
        env:
          PYTHON: python
        run: >
          mkdir -p reports/evidence &&
          python tools/run_evidence.py --tool frontend-e2e-l1
          --out reports/evidence/frontend-e2e-l1.json
          --artifact frontend/package-lock.json
          -- npm --prefix frontend run e2e

      - name: Upload CI evidence (run id + exact SHA + artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/evidence/
            reports/e2e/
            reports/gui_smoke/
          if-no-files-found: warn
          retention-days: 14
