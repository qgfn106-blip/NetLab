schema_version: 1
decisions:
- id: D1
  title: 模块存在形式
  decision: 每个模块一个独立文件（`*.block`），可单独拷贝；不做"只在内存里"的模块（Q1）
  namespace: D-NL
  canonical_id: D-NL-001
  legacy_id: D1
- id: D2
  title: 目录结构
  decision: '**工程目录**（`project.netlab` + `blocks/` + `extensions/` + `exports/` + `backups/`）+ 项目根 **`library/`**（`blocks/`、`templates/`）+ 用户目录
    `%APPDATA%/Netlab/settings.json`（Q2/Q4）'
  namespace: D-NL
  canonical_id: D-NL-002
  legacy_id: D2
- id: D3
  title: 通用资源归属
  decision: 母版/场景模板/可复用模块/全局设置只在父目录存一份，**不在每个工程重复生成**（Q3）
  namespace: D-NL
  canonical_id: D-NL-003
  legacy_id: D3
- id: D4
  title: 库与工程关系
  decision: '**引用式**：工程只记 `block_id + version`，不存正文；库改了工程行为跟着变；库丢失工程打不开（Q3 选 a）'
  namespace: D-NL
  canonical_id: D-NL-004
  legacy_id: D4
- id: D5
  title: 版本机制
  decision: 库内按 `blocks/<id>/v<N>.block` 存多版本；工程锁版本；旧版本永不自动删除（Q5 选 b）
  namespace: D-NL
  canonical_id: D-NL-005
  legacy_id: D5
- id: D6
  title: 破坏性操作
  decision: 删除/改名/覆盖前**扫描所有工程**引用，列出受影响清单，默认拒绝，需显式确认（Q5 选 c）
  namespace: D-NL
  canonical_id: D-NL-006
  legacy_id: D6
- id: D7
  title: 缺失/损坏
  decision: '**降级只读**：工程能开、缺块标出、**禁用运行**；给"用 default 占位块替换"与"重新定位文件"，**必须确认**；占位块打标记，确认端口映射后才允许运行（Q6 选 d）'
  namespace: D-NL
  canonical_id: D-NL-007
  legacy_id: D7
- id: D8
  title: 库读取时机
  decision: '**打开工程时读一次并按版本缓存**；运行中不读盘；有显式"重新载入库"（运行中需暂停+重置+确认）（Q7 选 a）'
  namespace: D-NL
  canonical_id: D-NL-008
  legacy_id: D8
- id: D9
  title: 双模型
  decision: '每个块/元件声明 `model: behavioral | structural`，**默认 behavioral**；structural 才可看/可改内部（Q8）'
  namespace: D-NL
  canonical_id: D-NL-009
  legacy_id: D9
- id: D10
  title: 改内部/升版本
  decision: 改内部 → **另存为副本（新 id）**；**版本号只由导入更高 version 产生**；同 id 同 version 内容不同 → 拒绝（Q9/Q10 选 a）
  namespace: D-NL
  canonical_id: D-NL-010
  legacy_id: D10
- id: D11
  title: 跨模式
  decision: '`signal ↔ vector` 互通；`signal/vector ↔ circuit` **必须经显式接口块**，不做隐式换算（Q11 选 c）'
  namespace: D-NL
  canonical_id: D-NL-011
  legacy_id: D11
- id: D12
  title: 导入前校验
  decision: 分**阻断级**（解析失败/端口对不上/引用缺失/干跑失败/版本冲突）与**警告级**（缺公式、缺描述、缺单位、命名不规范）；干跑 1 步；报告可复制（Q12 选 c）
  namespace: D-NL
  canonical_id: D-NL-012
  legacy_id: D12
- id: D13
  title: 信息架构
  decision: 顶级菜单 8 项；「场景」拆为 **工程/网络/层 + 设置**；「规格」拆为 **节点函数/连接函数**（Q13/Q29）
  namespace: D-NL
  canonical_id: D-NL-013
  legacy_id: D13
- id: D14
  title: 时间与循环
  decision: 播放器式；`T_step` 独立可配（默认=`dt`）；循环=手动+推荐（五步流水线）；**时间归零**与**重置**分开；循环只作用于回放（Q27/Q28）
  namespace: D-NL
  canonical_id: D-NL-014
  legacy_id: D14
- id: D15
  title: 分析窗口
  decision: 时间窗口可改、存进工程；可一键恢复"上次计算/推荐得到的窗口"
  namespace: D-NL
  canonical_id: D-NL-015
  legacy_id: D15
- id: D16
  title: 自动保存
  decision: '**快照式**（只写 `backups/`，不动正本）、默认 60 s 可关、有改动才写、保留最近 10 份 + 每天 1 份、只保存工程（Q15 选 c）'
  namespace: D-NL
  canonical_id: D-NL-016
  legacy_id: D16
- id: D17
  title: 性能
  decision: 开发期 `@timed` + 开关；产品级性能面板；**单拍超时保护**（超阈值暂停并定位节点）；**不做自适应降步**（Q14）
  namespace: D-NL
  canonical_id: D-NL-017
  legacy_id: D17
- id: D18
  title: 多网络
  decision: 一工程 = 多 Scene；编辑单层只算当前层；"全局运行"才算全部；跨层输入可冻结/手填/加调试输入源；分析允许单层但给提示（Q16/Q17）
  namespace: D-NL
  canonical_id: D-NL-018
  legacy_id: D18
- id: D19
  title: 左侧栏
  decision: 平铺列表 + 状态点；点击切换、双击改名、拖拽排序；新建/复制/删除（删除前查引用）；并行开关；宽度可拖、拖到最小自动收起（Q39 选 a）
  namespace: D-NL
  canonical_id: D-NL-019
  legacy_id: D19
- id: D20
  title: 频域
  decision: 两级：**轨迹近似**（FFT/自相关）与**运行点线性化**（真 Bode/Nyquist/根轨迹/裕度）；结论标来源（Q18 选 c）
  namespace: D-NL
  canonical_id: D-NL-020
  legacy_id: D20
- id: D21
  title: 关键值
  decision: 时域指标 + 模型指标，标注来源；**参数反解单独立项、不做承诺**（Q20 选 c）
  namespace: D-NL
  canonical_id: D-NL-021
  legacy_id: D21
- id: D22
  title: 数学形式
  decision: '**旁路分析层**，不进求解器；首选 sympy，失败则数值线性化并**说明原因**；sympy 可选依赖；L1 不强制、L2 要做、L3 后续尝试、L4 不做（Q34/Q35）'
  namespace: D-NL
  canonical_id: D-NL-022
  legacy_id: D22
- id: D23
  title: CSV 导出
  decision: 列名 `层.节点.字段`；头部元数据（工程/模式/dt/积分法/时间窗/版本）；时间窗裁剪与抽稀、流式；只写 `exports/`，同名加序号（Q19 选 b）
  namespace: D-NL
  canonical_id: D-NL-023
  legacy_id: D23
- id: D24
  title: 连线与外观
  decision: 路由 `auto/straight/orthogonal` + `manual` 锁定 + 尽量避让；锚点 auto 默认、逐边可改**且可拖**；尺寸可调（联动端点）；网格吸附可配（`Alt` 暂停）；GB 与风格切换**仅工程级**；自定义符号不做（Q24/Q25/Q26）
  namespace: D-NL
  canonical_id: D-NL-024
  legacy_id: D24
- id: D25
  title: 交互
  decision: 标准选择手势；撤销覆盖结构与参数、不覆盖运行状态与库变更；剪贴板含连接+参数+绑定；跨层粘贴**保留绑定但必须确认**；跨工程走片段文件（Q21/Q22/Q23）
  namespace: D-NL
  canonical_id: D-NL-025
  legacy_id: D25
- id: D26
  title: 搜索
  decision: 全局搜索（节点/连接/kind/模块/文档），可按网络/层限定；分组跳转；**不搜数值**（Q32）
  namespace: D-NL
  canonical_id: D-NL-026
  legacy_id: D26
- id: D27
  title: 帮助体系
  decision: '`?` 就地卡片（取值规则/映射/书写规范/示例 + 跳转实现）；内置文档中心（离线、非模态独立窗口、全文搜索）；术语统一 + 术语表；顶部信息条（Q30/Q31/Q33）'
  namespace: D-NL
  canonical_id: D-NL-027
  legacy_id: D27
- id: D28
  title: 快捷键
  decision: 固定表（`Ctrl+S`=保存工程、`Ctrl+Shift+E`=导出场景、`Ctrl+Alt+S`=另存为）；**自定义推迟**（Q37）
  namespace: D-NL
  canonical_id: D-NL-028
  legacy_id: D28
- id: D29
  title: 电路元件
  decision: 三批 + 不做区；GB 与同批交付；双模型给第二批（Q38）
  namespace: D-NL
  canonical_id: D-NL-029
  legacy_id: D29
- id: D30
  title: 模块 UI
  decision: 入口=「模块库」面板（拖拽实例化、右键封装）；进入内部=**独立打开为临时网络**，不做面包屑栈；模块本体用**矩形**（Q36）
  namespace: D-NL
  canonical_id: D-NL-030
  legacy_id: D30
- id: D31
  title: 分期
  decision: P0 地基（含热修）→ P1 模块闭环 → P2 画布 → P3 分析 → P4 元件 → P5 帮助 → P6 后续（Q40）
  namespace: D-NL
  canonical_id: D-NL-031
  legacy_id: D31
- id: D35
  title: 布局策略
  decision: '**放弃自动布局作为主路径**：元件位置由显式 `layout{x,y,rot}` 决定（agent/用户摆位），符号沿导线方向、导线从引脚直线接入；`/api/schematic/layout` 仅保留为实验/迁移工具，不在 UI 暴露'
  namespace: D-NL
  canonical_id: D-NL-032
  legacy_id: D35
- id: D36
  title: 电路元件节点化
  decision: 电路**器件 = 节点**（引脚声明在元件定义里），网络节点保留；**边 = 导线**，带 `source_pin`/`target_pin`，只允许 pin↔net；MNA 未知量仍按网络节点编号（Q2/Q4）
  namespace: D-NL
  canonical_id: D-NL-033
  legacy_id: D36
- id: D37
  title: 引脚契约
  decision: 每个元件声明 `PinSpec`（name/role/required/顺序/几何）；`required` 引脚必须恰好接一条导线；未声明引脚、重复接线、缺接均为阻断级（Q6）
  namespace: D-NL
  canonical_id: D-NL-034
  legacy_id: D37
- id: D38
  title: 组件黑盒与内部网络
  decision: 组件 = 引脚 + 计算函数，运行时**不建中介节点**；内部网络定义保存为 structural，默认黑盒，模块化后才显示/展开；内置 structural 只读随程序发布（库缺失不影响打开），用户模块化才写 `.block` 库并受版本/引用保护（Q3/Q5/Q10）
  namespace: D-NL
  canonical_id: D-NL-035
  legacy_id: D38
- id: D39
  title: 求解与信号侧端口
  decision: '电路统一 PinMap：装配层生成 `pins{引脚名: 网络 id}`，元件用 `self.pin(...)`，`a/b` 变别名，参数端口改引脚，旧参数走兼容垫片；信号/矢量边显式 `source_port`/`target_port`，方法按端口取值，旧边不填端口按现状兼容（Q7/Q8）'
  namespace: D-NL
  canonical_id: D-NL-036
  legacy_id: D39
- id: D40
  title: 节点化迁移与交付
  decision: v3→v4 **自动迁移**（元件边→器件节点+引脚导线，迁移前备份、幂等、旧字段读成引脚）；先模型（只电路层）→ 再 UI → 信号/矢量端口随后；每阶段全绿+新测试封口；兼容问题在 §8.1 专节标注（Q9/Q11/Q12）
  namespace: D-NL
  canonical_id: D-NL-037
  legacy_id: D40
- id: D32
  title: 控制理论导向
  decision: L1 术语/图形对齐（不强制）；L2 自动求闭环传递函数与数学形式；均为呈现层，不影响求解器（Q34）
  namespace: D-NL
  canonical_id: D-NL-038
  legacy_id: D32
- id: D33
  title: 图纸规范
  decision: 采用 GB/T 4728 风格**矢量线稿**：位号+参数+汇合点+符号处断线+正交；不做国标尺寸公差/完整图框（后续可加图纸模式）
  namespace: D-NL
  canonical_id: D-NL-039
  legacy_id: D33
- id: D34
  title: 图纸模型
  decision: '**电气拓扑层与图纸布局层分离**：引脚=几何+电气绑定（两端 source/target，多端 `pins{引脚:节点}`）；元件 `layout{x,y,rot}`，旋转 30° 步长；电节点=网络锚点；导线默认正交、非 H/V 引脚先沿轴再接折线；自动布局确定性（拓扑分层+20
    网格+lane），手工优先；依据 GB/T 4728/6988.1/18135/5094/4026 的**风格**，不冒充国标数值'
  namespace: D-NL
  canonical_id: D-NL-040
  legacy_id: D34
- id: D41
  title: 比较器/运放端口
  decision: 二者统一改 **推挽单端 5 脚** `IN+ / IN− / V+ / V− / OUT`；`V+/V−` 为**可选引脚**：未接线时用参数 `VCC/VEE`（默认 +15/−15），接了线按引脚真实电压；输出定义在 `OUT` 与 `V−` 之间：`v(OUT)−v(V−)=(v(V+)−v(V−))·tanh(...)`；`vcvs/vccs`
    仍保留 `IN±/OUT±` 浮动输出（Q1/Q5）
  namespace: D-NL
  canonical_id: D-NL-041
  legacy_id: D41
- id: D42
  title: 电路语义迁移
  decision: v4→v5 **自动迁移**：`OUT+`→`OUT`；`OUT−` 的导线断开（不删其他器件）；`vmax`→`VCC=+vmax`、`VEE=−vmax`；`V+/V−` 保持未接（走参数默认）；旧 `OUT−` 接地者行为不变，接非地者在迁移报告逐条列出（Q6）
  namespace: D-NL
  canonical_id: D-NL-042
  legacy_id: D42
- id: D43
  title: 接线放宽
  decision: '**未接齐的器件不参与求解**：运行不再因必接引脚缺失而阻断，画布在运行中给红色辉光并列出"未参与"；被跳过的器件所形成的孤立网络一并忽略；`vsource/isource` 只接一端时，另一端**自动对地**并在图上画可见接地标记（Q3）'
  namespace: D-NL
  canonical_id: D-NL-043
  legacy_id: D43
- id: D44
  title: 多接地
  decision: 放开"电路只能一个接地"：可任意添加接地符号，**全部自动合并为同一 0V 参考**（引擎已 union）；状态显示"共 N 个接地，已合并"；用导线连两个地允许但冗余（Q4）
  namespace: D-NL
  canonical_id: D-NL-044
  legacy_id: D44
- id: D45
  title: 右键动作集
  decision: 全量动作集（空白/器件/网络节点/导线/多选五类上下文，含引脚右键、对齐分布、显示开关、拐点、快捷键提示），分两批交付；菜单支持子菜单与分组（Q13）
  namespace: D-NL
  canonical_id: D-NL-045
  legacy_id: D45
- id: D46
  title: 元件分类
  decision: catalog `ElementSpec.group` 为**唯一分类来源**，固定 10 组：基础无源/电源/受控源/二极管/开关/放大与比较/晶体管/数字与逻辑/计时与电源管理/磁性；"导线"作为独立工具与独立分组；未登记 group 落"未分类"并由测试报警（Q14）
  namespace: D-NL
  canonical_id: D-NL-046
  legacy_id: D46
- id: D47
  title: 测量仪表
  decision: '**探针式仪表**：电压表/电流表/示波器/李萨如均为旁路观察，不进入 MNA、不改变电路；示波器 1–4 通道时域，李萨如取 X/Y 两通道；读数与波形集中于"仪器"面板（Q15）'
  namespace: D-NL
  canonical_id: D-NL-047
  legacy_id: D47
- id: D48
  title: 时间轴与回放
  decision: 时间轴**只回放记录、不改变电路状态**；拖动看历史帧并标注"回放中"，继续从最新时刻向前算；电路改动后旧记录**保留并标过期**（红色角标+横幅+水印），提供"重新求解"；循环只在回放窗口内；波形显示窗口可设；**重置保留探针通道与仪器设置**；新增独立"求解窗口"入口（0→T、步长、通道）后台预计算，可选用（Q16/Q18）
  namespace: D-NL
  canonical_id: D-NL-048
  legacy_id: D48
- id: D49
  title: 电路模块端口
  decision: 端口 = **网络**；两种标记入口：① 1 引脚"模块端口"符号（名称/方向 in/out/inout）；② 右键网络节点"设为模块端口"；封装以标记为准，未标记的跨界网络自动补端口并警告（Q7）。**2026-10-30**：右键入口改为子菜单（设为模块端口
    / 改端口方向 → 输入·输出·双向，已标记可取消），库卡片端口摘要按方向分组；封装边界按**外部网络分组**，同一外部网络只出一个端口（修掉 `mid`/`mid_2` 重复端口）；过期选中集给「刷新画布」提示
  namespace: D-NL
  canonical_id: D-NL-049
  legacy_id: D49
- id: D50
  title: 模块内部视图
  decision: 内部网络以**页面内浮动窗口**打开，可**收起为可折叠侧边栏**（不销毁未保存改动），关闭后可再打开；模块本体仍是 `.block` 库文件，打开内部只是编辑视图（D30 修订）（Q9/Q10）。**2026-10-29 落地（P7-07）**：`#moduleWin`
    只读预览浮窗（端口列表 + 统计 + canvas 结构图，端口/接地/器件/网络四档配色），`#moduleDock` 收成右侧 300px 侧栏；模块库「打开内部」与网络列表右键「在模块内部浮窗中打开」都进这扇窗；「在临时网络中编辑」成功才收窗，失败保留预览并 toast
  namespace: D-NL
  canonical_id: D-NL-050
  legacy_id: D50
- id: D51
  title: 电路模块求解
  decision: 模块 = 外部输入/输出节点 + **独立内部网络层** + 端口映射；电路模式求解时**电气直连展开**（内外端口合并同一 MNA 节点，内部器件进父矩阵），封装前后节点电压逐点一致；信号流仍走数据传递（用户原话，Q8）
  namespace: D-NL
  canonical_id: D-NL-051
  legacy_id: D51
- id: D52
  title: 内置内部结构
