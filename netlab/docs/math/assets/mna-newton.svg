<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">MNA assembly and Newton solve</title><desc id="desc">Elements stamp a linearized MNA system, Newton solves it, and line search accepts or rejects the step.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="960" height="440" fill="#f8fafc"/><text x="38" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">MNA：装配 → 线性化 → 接受/回滚</text>
<g font-family="sans-serif"><rect x="45" y="135" width="195" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="74" y="170" font-size="18" font-weight="700" fill="#92400e">元件模型</text><text x="74" y="198" font-size="15" fill="#451a03">prepare / stamp</text><text x="74" y="222" font-size="15" fill="#451a03">history + guess</text>
<rect x="300" y="135" width="195" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="339" y="170" font-size="18" font-weight="700" fill="#1e3a8a">MNA 系统</text><text x="339" y="198" font-size="15" fill="#172554">A(xᵢ) Δx = r</text><text x="339" y="222" font-size="15" fill="#172554">G B / C D blocks</text>
<rect x="555" y="135" width="160" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="591" y="170" font-size="18" font-weight="700" fill="#5b21b6">Newton</text><text x="591" y="198" font-size="15" fill="#3b0764">solve + residual</text><text x="591" y="222" font-size="15" fill="#3b0764">gmin / stepping</text>
<rect x="775" y="135" width="140" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="807" y="170" font-size="18" font-weight="700" fill="#166534">提交</text><text x="807" y="198" font-size="15" fill="#14532d">accept</text><text x="807" y="222" font-size="15" fill="#14532d">or rollback</text>
<path d="M240 190 L300 190" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M495 190 L555 190" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M715 190 L775 190" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M845 246 C845 340 665 370 455 275" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="540" y="365" font-size="16" fill="#991b1b">残差/线搜索失败：恢复 checkpoint</text><text x="115" y="315" font-size="17" fill="#334155">x = [非地节点电压；支路电流]ᵀ</text></g></svg>
