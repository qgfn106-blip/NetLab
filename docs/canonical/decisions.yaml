- id: D154
  title: 审计剩余项治理与路线拍板（2026-11-08，用户拍板，承接 D120–D153）
  decision: 用户确认按推荐方案全开，把剩余工作拆成 **12 / 20 / 14** 三轮目标（目标一 W0 收口 + C-4 + N-08；目标二 C-1/C-2 结构拆分；目标三 治理/文档/覆盖率/打包）。①**C-4 口径（2026-11-08 按用户新契约修正）**：以审计
    §5.1「R2 四款可测判据」为准——①不复制源码（`netlab/_vendor/plotkit` 最终不存在）②不覆盖导入优先级（无 `sys.path.insert`）③不注入第三方页面（无 HTML 注入 / fragment token / 全局 monkey-patch；删除前必须先有等价鉴权）④不碰私有符号（`DATA_LOCK`
    / `STATIC_DIR` / `create_app` / `store.registry` / `server.assets` 零引用，由 PlotKit 侧提供最小稳定公开 API 与 `probe()` 三态）。**wheel 只是构建产物形态，不构成解耦或达标证据，且二进制不得提交进主仓
    git**（放 release assets 或 `.gitignore` 的构建产物目录）。D124 的 vendor 源码副本是过渡态、不是目标态。②**P 项归属**：P-01…P-11 全部回 `PlotKit/` 仓修，口径用 `PlotKit/docs/REQUIREMENTS_AND_PROGRESS.md`；netlab
    侧只做接口契约测试 / mock / 摘除测试 / 版本协商，不改 P 项；P-06（NS 伪谱求解器）先标 `experimental`，删或留待定。③**单轮预算 R10（三类轮）**：以审计 §5 R10 为唯一权威定义——L 逻辑轮 ≤5 文件 / ≤300 行；M
    纯搬运轮 ≤5 文件 / ≤800 行（**按逻辑源码计**：`git diff --numstat HEAD -- '*.ts'` 排除 `*.js` 编译产物与 `package.json`，并显式枚举新增/未跟踪 `.ts` 的 `wc -l`，写明 `ins+del`
    双边；TS parity 还要求产物已 git-tracked、函数/类体 hash 不变，纯类型模块不生成 `.js`）；M1 按语言分叉：Python 轮用 `tools/check_move_equivalence.py` 的 AST 等价检查，TS 轮用 `frontend/tools/verify_app_parity.js`
    + `npm run build` + 扩全的产物漂移门（含 `frontend/app/**/*.js`）；D 纯删除轮 ≤5 文件 / 行数不限，必须 grep 零引用、独立 commit、替代路径已验证。前端 esbuild 入口由 `frontend/scripts/build.mjs`
    自动收集 `app/*.ts`，每轮不再改 `package.json`。原 R10′ 的「≤2 文件 / ≤800 行 + `git diff -w --numstat` 增删差」条款作废，不得再引用。④**覆盖率三层**：`netlab/core/*` 设硬门限（基线实测
    **81%**，`--cov-fail-under=78` ratchet 只升不降）；`netlab/server_*`（实测 **87%**）与 `plotkit_bridge`（**73%**）只报告不设门限；omit `_vendor` / `tests` / `desktop`
    / `__main__`；另要求 diff coverage ≥80%。⑤**编号勘误**：A-5 = N-08 通道键（**不是**大文件拆分；现状为 id 字符串键，`ChannelKey` 结构化类型未落地），N-10 巨石文件的编号裁定以审计 §4.3 C-1 为准：C-1a
    = `server.py` 路由拆分（D137–D153 已完成 15 步）、C-1b = `nodal.py` / `scene.py` 拆分（本轮）、C-2 = `app.ts` 拆分；D131 / D137 标签已由「A-5/N-10」更正为「C-1/N-10」。⑥**审计文档位置**：`ProjectPoint/docs/NETLAB_PLOTKIT_AUDIT_AND_REMEDIATION.md`
    不在 NetlabHome 仓内、无版本历史，阶段进度以本台账 + BACKLOG + PROGRESS 为准。⑦**W0 基线**：上一轮 80 项未提交改动已切分为 7 个 commit（`9cc5641` → `e9de1a5`），工作树干净；全量 `python -m
    pytest netlab/tests -q` → 678 passed / 1 skipped（无覆盖率 70.71s；`--cov=netlab --cov-branch` 217.32s）。⑧**S5 结束条件（2026-11-08 用户 m05246 拍板，m05394
    复核）**：`frontend/app.ts` ≤ 8,000 行；机检口径 `frontend/tools/check_app_sections.mjs` 用 TypeScript AST 取每个顶层语句行跨度，任一 >800 行即失败；每个 `frontend/app/*.ts`
    ≤800 行；`npm run verify:parity` + 全量 pytest + npm typecheck/test/build + 产物漂移门全绿；满足后才启动 D-1 覆盖率与 M 轮留痕。
