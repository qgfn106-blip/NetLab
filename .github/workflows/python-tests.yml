name: python-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # D-1 变更行覆盖率需要 HEAD^ / merge-base，浅克隆会让 git diff 退出 128。
          fetch-depth: 0

      - name: README changelog check (最近 10 次更新)
        run: python tools/update_readme_changelog.py --check

      - name: Checkout PlotKit (公开依赖)
        uses: actions/checkout@v4
        with:
          repository: qgfn106-blip/PlotKit
          path: .plotkit-src

      - name: Setup Node (section budget gate)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: netlab/requirements-dev.txt

      - name: Install
        working-directory: netlab
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ../.plotkit-src

      - name: Docs SSOT render (G4)
        run: python tools/render_docs.py --check

      - name: Section budget (strict audit P0)
        working-directory: frontend
        run: |
          npm ci
          npm run check:sections

      - name: Version single source (D-2)
        run: python tools/check_version.py

      - name: Architecture contracts (G1)
        run: python tools/check_architecture.py --json reports/architecture.json

      - name: Contract artifacts in sync (C1/C2)
        run: python tools/gen_contracts.py --check

      - name: Requirement verifiability sample (B-2)
        env:
          PYTHONPATH: .
        run: python tools/check_requirement_verifiability.py --ids R01,R43,R26

      - name: Prepare sample projects for regression tests
        run: |
          mkdir -p MyProject
          cp netlab/tests/fixtures/projects/*.netlab MyProject/

      - name: Solver shadow gate (hard gate)
        working-directory: .
        env:
          PYTHONPATH: .
        run: python tools/solver_shadow_check.py --json

      - name: Numerical benchmarks (hard gate)
        working-directory: .
        env:
          PYTHONPATH: .
        run: pytest netlab/tests/benchmarks -q

      # 覆盖率门限（D154）：只对 core 设硬门限，server_*/desktop/vendor 不设。
      # 必须用路径形式 --cov=netlab/core：点号形式 --cov=netlab.core 会让 pytest-cov
      # 提前 import 包，触发 numpy 二次导入，sparse 组装直接 TypeError（见 LESSONS.md）。
      - name: Full Python test suite + core coverage gate
        working-directory: .
        env:
          PYTHONPATH: .
        run: >
          mkdir -p reports &&
          pytest netlab/tests -q
          --cov=netlab/core --cov-branch --cov-fail-under=81
          --cov-report=term-missing:skip-covered
          --cov-report=json:coverage.json
          --junitxml=reports/pytest.xml

      # D-1：变更行覆盖率。push 用 github.event.before，PR 用 base.sha；
      # 脚本内部取 merge-base，非可执行新增行（注释/空行）不计入分母。
      - name: Changed-line coverage (D-1)
        env:
          PYTHONPATH: .
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/diff_coverage.py --coverage coverage.json --base "$DIFF_BASE" --threshold 80

      - name: Write test status artifact (B-3)
        env:
          PYTHONPATH: .
        run: >
          python tools/write_test_status.py
          --junit reports/pytest.xml
          --coverage coverage.json
          --command "pytest netlab/tests -q --cov=netlab/core --cov-branch --cov-fail-under=81"

      - name: Status freshness (B-3)
        env:
          PYTHONPATH: .
        run: |
          python tools/gen_status.py
          python tools/check_status_freshness.py

  desktop-l2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime + desktop deps
        working-directory: netlab
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywebview pythonnet

      - name: L2 desktop selftest
        run: python tools/e2e_desktop_smoke.py
