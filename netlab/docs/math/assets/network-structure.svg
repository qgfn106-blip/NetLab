<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">网络结构：节点、有向连接与端口</title><desc id="desc">节点与有向连接构成网络；连接方法只读两端视图，延迟边读取上一拍值。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1000" height="600" fill="#f8fafc"/>
<text x="40" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">网络结构：节点、有向连接与端口</text>
<g font-family="sans-serif">
<rect x="30" y="110" width="180" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="120.0" y="145.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">输入数据 D</text>
<text x="120.0" y="167.5" text-anchor="middle" font-size="14" fill="#0f172a">外部信号 / 上一拍输出</text>
<rect x="250" y="95" width="220" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="360.0" y="136.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">节点 A</text>
<text x="360.0" y="158.5" text-anchor="middle" font-size="14" fill="#0f172a">f_A · S_A · Θ_A</text>
<text x="360.0" y="176.5" text-anchor="middle" font-size="14" fill="#0f172a">data_A</text>
<rect x="580" y="95" width="220" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="690.0" y="136.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">节点 B</text>
<text x="690.0" y="158.5" text-anchor="middle" font-size="14" fill="#0f172a">f_B · S_B · Θ_B</text>
<text x="690.0" y="176.5" text-anchor="middle" font-size="14" fill="#0f172a">data_B</text>
<rect x="400" y="330" width="220" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="510.0" y="371.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">节点 C</text>
<text x="510.0" y="393.5" text-anchor="middle" font-size="14" fill="#0f172a">f_C · S_C · Θ_C</text>
<text x="510.0" y="411.5" text-anchor="middle" font-size="14" fill="#0f172a">data_C</text>
<rect x="790" y="340" width="180" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="880.0" y="380.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">节点 D</text>
<text x="880.0" y="402.5" text-anchor="middle" font-size="14" fill="#0f172a">f_D · S_D · Θ_D</text>
<line x1="210" y1="150" x2="250" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="230" y="140" text-anchor="middle" font-size="13" fill="#1e3a8a">D</text>
<line x1="470" y1="150" x2="580" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="525" y="138" text-anchor="middle" font-size="13" fill="#1e3a8a">e1: g_e1(端口)</text>
<line x1="640" y1="205" x2="630" y2="330" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="690" y="270" text-anchor="middle" font-size="13" fill="#1e3a8a">e2</text>
<line x1="400" y1="360" x2="320" y2="205" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="285" y="285" text-anchor="end" font-size="13" fill="#7c3aed">e3: z⁻¹ 延迟边</text>
<line x1="790" y1="385" x2="620" y2="385" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="705" y="375" text-anchor="middle" font-size="13" fill="#1e3a8a">e4</text>
<text x="40" y="505" text-anchor="start" font-size="14" fill="#475569">s(e), t(e) 定义有向边；e3 是延迟边，读取上一拍缓存值。</text>
<text x="40" y="535" text-anchor="start" font-size="14" fill="#475569">Θ = 参数；S = 跨步状态；Port = 端口绑定；每个连接独立方法 g_e。</text>
<text x="40" y="565" text-anchor="start" font-size="14" fill="#475569">连接方法只能读 source.view / target.view，不得原地修改上游 data。</text>
</g>
</svg>
