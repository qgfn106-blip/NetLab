name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine cyclonedx-bom

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel -o dist

      - name: Twine check
        run: python -m twine check dist/*

      - name: Verify plotkit is a required dependency
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              metadata = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              text = zf.read(metadata).decode("utf-8")
          requires = [line for line in text.splitlines() if line.startswith("Requires-Dist: plotkit")]
          assert requires, "wheel METADATA 缺少 plotkit 必需依赖"
          assert not any("extra == \"plotkit\"" in line for line in requires), "plotkit 不应再是可选 extra"
          print(requires[0])
          PY

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: SBOM
        run: cyclonedx-py environment -o dist/sbom.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netlab-dist
          path: dist/*
