<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#65757e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #1f2528; }
      .subtitle { font-size: 16px; fill: #65757e; }
      .box-title { font-size: 22px; font-weight: 700; fill: #22282b; }
      .box-text { font-size: 15px; fill: #4f5d66; }
      .small { font-size: 14px; fill: #65757e; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fbfbfa"/>
  <text x="60" y="58" class="title">Netlab 分层架构（2026-11-06 · R01–R40）</text>
  <text x="60" y="88" class="subtitle">浏览器/桌面壳只负责显示与交互；计算内核与模型保持纯 Python；插件只依赖 netlab.plugin_api.v1。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="130" width="1480" height="120" rx="12" fill="#eef3f6" stroke="#8fb3c4" stroke-width="1.8"/>
    <text x="90" y="172" class="box-title">展示层 · frontend/ + desktop/</text>
    <text x="90" y="205" class="box-text">index.html · style.css · app.js（Canvas 2D / 面板 / 曲线 / 回放 / 视图设计） · desktop-shim.js · pywebview 壳</text>
  </g>
  <line x1="800" y1="250" x2="800" y2="300" stroke="#65757e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="282" class="small">HTTP / WebSocket / 桌面 token</text>

  <g filter="url(#shadow)">
    <rect x="60" y="300" width="1480" height="120" rx="12" fill="#f1f0ea" stroke="#b7b09c" stroke-width="1.8"/>
    <text x="90" y="342" class="box-title">接口层 · netlab/server.py</text>
    <text x="90" y="375" class="box-text">FastAPI 生命周期 · 场景/工程/节点/边 API · /api/catalog · /api/analysis/* · /api/plugins/* · /api/ui · 桌面 token</text>
  </g>
  <line x1="800" y1="420" x2="800" y2="470" stroke="#65757e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="452" class="small">服务调用 / 快照与增量</text>

  <g filter="url(#shadow)">
    <rect x="60" y="470" width="1480" height="300" rx="12" fill="#f5f1f7" stroke="#b9a5c5" stroke-width="1.8"/>
    <text x="90" y="512" class="box-title">计算内核 · netlab/core/compute/</text>
    <rect x="90" y="535" width="330" height="95" rx="8" fill="#ffffff" stroke="#d4c2dc"/>
    <text x="110" y="568" class="box-text" font-weight="700">SignalEngine / Network</text>
    <text x="110" y="593" class="box-text">signal + vector · 节点数据字典 ·</text>
    <text x="110" y="614" class="box-text">非线性/非定常 · 求解计划/SCC</text>
    <rect x="440" y="535" width="330" height="95" rx="8" fill="#ffffff" stroke="#d4c2dc"/>
    <text x="460" y="568" class="box-text" font-weight="700">CircuitEngine / nodal</text>
    <text x="460" y="593" class="box-text">MNA + Newton · R/L/C/器件 ·</text>
    <text x="460" y="614" class="box-text">DC 工作点 · 复数 AC 扫频</text>
    <rect x="790" y="535" width="330" height="95" rx="8" fill="#ffffff" stroke="#d4c2dc"/>
    <text x="810" y="568" class="box-text" font-weight="700">FEM / 分析</text>
    <text x="810" y="593" class="box-text">Q4 瞬态热传导 · 总传函/Bode ·</text>
    <text x="810" y="614" class="box-text">相图 · frequency_response (R39)</text>
    <rect x="1140" y="535" width="370" height="95" rx="8" fill="#ffffff" stroke="#d4c2dc"/>
    <text x="1160" y="568" class="box-text" font-weight="700">求解基础设施</text>
    <text x="1160" y="593" class="box-text">状态空间 · 最优控制 · PlotKit 桥 ·</text>
    <text x="1160" y="614" class="box-text">记录器/预计算 · 插件 AnalysisSpec</text>
    <text x="90" y="680" class="box-text">扩展点：compute / method / element / analysis / data-format / template / panel / visual / engine(mode)</text>
    <text x="90" y="710" class="box-text">约定：参数只从 ParamSpec；跨步状态只放 state；返回 JSON 原生类型；不改 NodeRecord/EdgeRecord 核心字段。</text>
  </g>
  <line x1="800" y1="770" x2="800" y2="820" stroke="#65757e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="802" class="small">Scene / Graph / 工程文件</text>

  <g filter="url(#shadow)">
    <rect x="60" y="820" width="720" height="140" rx="12" fill="#eef6ee" stroke="#9bbf9b" stroke-width="1.8"/>
    <text x="90" y="862" class="box-title">模型层 · netlab/core/model/</text>
    <text x="90" y="895" class="box-text">Scene · Graph · NodeRecord · EdgeRecord · BlockDef · BlockRuntime</text>
    <text x="90" y="922" class="box-text">Project v6（plugins/ui）· 场景模板 · 端口/字段匹配 · 工程 checksum</text>
    <rect x="820" y="820" width="720" height="140" rx="12" fill="#fff6e9" stroke="#d9b778" stroke-width="1.8"/>
    <text x="850" y="862" class="box-title">扩展层 · netlab/plugin_api/v1 + extensions/</text>
    <text x="850" y="895" class="box-text">plugin.json / PluginManager / capabilities / dependencies · 插件包</text>
    <text x="850" y="922" class="box-text">legacy extensions/nodes|methods（兼容） · 受信任进程内 Python</text>
  </g>
</svg>
