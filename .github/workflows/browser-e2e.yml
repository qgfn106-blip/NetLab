name: browser-e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PlotKit (公开依赖)
        uses: actions/checkout@v4
        with:
          repository: qgfn106-blip/PlotKit
          path: .plotkit-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: netlab/requirements-dev.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r netlab/requirements-dev.txt
          pip install ./.plotkit-src

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Chromium (与 playwright-core 同版本)
        working-directory: frontend
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Prepare sample projects
        run: |
          mkdir -p MyProject
          cp netlab/tests/fixtures/projects/*.netlab MyProject/

      - name: Browser end-to-end (5 flows)
        working-directory: frontend
        env:
          PYTHON: python
          E2E_ARTIFACTS_DIR: ../reports/e2e
        run: npm run e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: reports/e2e
          retention-days: 7
          if-no-files-found: warn
