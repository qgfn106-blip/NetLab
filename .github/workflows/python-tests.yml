name: python-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: netlab/requirements-dev.txt

      - name: Install
        working-directory: netlab
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Solver shadow gate (hard gate)
        working-directory: .
        env:
          PYTHONPATH: .
        run: python tools/solver_shadow_check.py --json

      - name: Numerical benchmarks (hard gate)
        working-directory: .
        env:
          PYTHONPATH: .
        run: pytest netlab/tests/benchmarks -q

      - name: Full Python test suite
        working-directory: .
        env:
          PYTHONPATH: .
        run: pytest netlab/tests -q
