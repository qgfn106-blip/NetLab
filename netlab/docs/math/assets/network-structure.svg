<rect width="960" height="420" fill="#f8fafc"/><text x="40" y="45" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">N = (V, E, s, t, Port, delay)</text>
<g font-family="sans-serif"><rect x="80" y="130" width="220" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="110" y="170" font-size="22" font-weight="700" fill="#1e3a8a">Node u</text><text x="110" y="205" font-size="16" fill="#334155">data D</text><text x="110" y="232" font-size="16" fill="#334155">state Sᵤ</text><text x="110" y="259" font-size="16" fill="#334155">params Θᵤ</text>
