schema_version: 1
requirements:
- id: R01
  title: 工程目录与通用库
  status: '**2026-10-26 后端已落地**——新增 `netlab/core/model/workspace.py`（工程目录约定、建工程、库扫描、路径解析、用户设置）；`project.netlab`
    放进工程目录，`library/` 在父目录单份共享；设置写 `%APPDATA%/Netlab/settings.json`（`NETLAB_SETTINGS_DIR`
    可覆盖）；服务端有 `/api/workspace` 与 `/api/settings`；`test_workspace.py` 7 项通过。**未做**：前端新建/打开工程面板接线、桌面桥目录选择（票
    02/04）。'
  acceptance: 新建工程生成完整目录树；两个工程共用同一 `library/` 下的模块；删除工程不影响库；`settings.json` 在用户目录且不随工程走。
  weight: ⭐⭐⭐⭐⭐ / P0
  stage: ⭐⭐⭐⭐⭐ / P0
- id: R02
  title: 模块文件化与模块库面板
  status: '**2026-10-26 完成**——① 文件层 `netlab/core/model/blocklib.py`（`.block` JSON
    + sha256、`library/blocks/<id>/v<N>.block`、同版本冲突拒绝/幂等、导入必须更高版本）；② UI：右侧「模块」页签（列表/刷新/导入
    `.block`/封装选中/实例化），API `POST /api/blocks/{instantiate,encapsulate}`；③ 未接线实例按端口默认值补
    0，可先摆放后接线。**2026-10-26 收尾**：模块项可拖拽到画布实例化（DragEvent + DataTransfer，落点是世界坐标）；库删除/改名/覆盖统一先扫引用（R03）。'
  acceptance: 封装 → 生成 `.block` → 新工程拖入可用；模块文件可单独拷到另一台机器导入；库面板可搜索/预览/删除（删除前查引用）。
  weight: ⭐⭐⭐⭐⭐ / P1
  stage: ⭐⭐⭐⭐⭐ / P1
- id: R03
  title: 版本、引用保护与缺失降级
  status: '**2026-10-26 完成**——① 工程 v3 `blocks` 只存 `{id,version}`，保存前 `ensure_blocks`
    同步库，打开时按库解析；② 缺失时**降级只读**：用占位块（端口由场景映射推导、带 placeholder 标记）打开，`sim.degraded` 暴露清单，`/api/control`
    运行/单步返回 409，`NetworkContainer.mutate` 拒绝一切编辑；③ 删除模块前 `scan_block_references` 扫描工程目录引用，`POST
    /api/blocks/{id}/delete` 无 force 时 409 并列出工程名；④ 前端收到 degraded 显示红色横幅。**2026-10-26
    收尾**：删除、改名、覆盖都先 `scan_block_references`，有引用默认 409、`force=true` 才执行（D6 三项齐）；D7
    的解除路径：补回库文件后模块面板「补回后重试」→ `POST /api/project/retry` 严格重校验并解除只读（仍缺 → 409）；占位块替换成新模块的交互未做。'
  acceptance: 改库后旧工程行为不变；删库文件后打开工程报明确清单且不能运行；确认替换后可运行但带"占位"标记；同 id 同 version 内容不同被拒。
  weight: ⭐⭐⭐⭐ / P1
  stage: ⭐⭐⭐⭐ / P1
- id: R04
  title: 模块导入前校验
  status: '**2026-10-26 完成**——新增 `netlab/core/model/block_validate.py`：阻断级（结构/坏端点/端口无内部接口/自引用/干跑失败）与警告级（缺描述、空模块、无内部连接、无输入/输出、端口无字段、接口未声明、嵌套子模块不在库）两级；干跑真实
    `BlockRuntime.step` 1 步并记录 passed/skipped/failed；报告为 JSON（`blocking/warnings/summary/block`）+
    纯文本 `text`，可直接复制；API `POST /api/blocks/validate`；前端 `.block` 导入流程改为「先校验：阻断→横幅拒绝，警告→确认后导入」。**2026-10-26
    收尾**：`POST /api/blocks/validate` 支持 `save_report=true`，把 JSON 报告写进当前工程 `exports/block-validate-<id>-v<N>-<时间戳>.json`（`CURRENT_WORKSPACE`
    由新建/保存/打开工程设置）。模块面板独立「校验」按钮未做（导入流程已内置校验）。'
  acceptance: 端口错位被拒并指出端口名；缺公式/缺描述可导入但标警告；干跑失败拒绝导入并给最小复现信息。
  weight: ⭐⭐⭐⭐ / P1
  stage: ⭐⭐⭐⭐ / P1
- id: R05
  title: 模块内部编辑与双模型
  status: '**2026-10-26 完成基础层**——`BlockDef.model`（behavioral|structural）写进 `.block`
    与 summary；封装 API 支持 `model`（面板有「封装为结构模型」勾选）；`POST /api/blocks/{id}/open-internal`
    仅对 structural 开放（behavioral → 409），把内部作为**独立临时网络**打开（D30，不做面包屑）；`POST /api/blocks/save-copy`
    把当前网络另存为新模块（新 id、v1、默认 structural，D10）；面板每个模块有「打开内部」按钮（behavioral 置灰）、工具栏「另存为副本」。**2026-10-26
    收尾**：画布从不展开内部（behavioral 天然满足展示层「不展开」）；运行时仍展开内部求值（行为公式路径未定义，性能目标未变）——这点在 R05 正文明确标注。临时网络清理：模块面板「关闭内部网络」按钮（删除当前以「模块
    」开头的临时网络）。'
  acceptance: 行为模型实例化不展开内部（性能不变）；结构模型可看内部并另存为副本；默认必须是 behavioral。
  weight: ⭐⭐⭐⭐ / P1
  stage: ⭐⭐⭐⭐ / P1
- id: R06
  title: 跨模式与接口块
  status: '**2026-10-26 P1 部分完成**——① 跨模式拒绝：`Scene._check_block_mode` 在 add_node /
    update_node / load_payload 三处校验，模块 mode 与场景不一致即 ValidationError（提示改用同模式模块或显式接口），实例化
    API 返回 422；② 新增两个显式接口节点：`if_signal_to_vector`（u → x=u·cosθ, y=u·sinθ）、`if_vector_to_signal`（x/y/模长
    → 标量，可缩放），已登记公式与 catalog；③ 单测覆盖角度映射、分量/模长、跨模式拒绝。**2026-11-07 电路侧接口完成**——新增 `if_voltage_to_signal`（复用
    `SensorElement`，高阻采样并写 `voltage` 字段）与 `if_signal_to_current`（`ActuatorCurrent`，按
    `state[''drive'']` 驱动电流源，显式一拍延迟）；两者登记 catalog/group，`test_powerelectronics.py`
    覆盖存在性；新建工程流程改为先选 `signal/circuit/vector` 模式，再 POST `/api/scene/clear?mode=...`（未知模式
    422）。'
  acceptance: signal 块放入 circuit 被拒并给替换建议；经接口块能跨界且数值正确；接口块有单测。
  weight: ⭐⭐⭐ / P1（接口块）/ P4（电路侧完善）
  stage: ⭐⭐⭐ / P1（接口块）/ P4（电路侧完善）
- id: R07
  title: 一工程多网络（层）
  status: '**2026-10-26 数据模型 + 服务容器 + API 已落地**——`project.netlab` v3（`networks: [...]`
    + `current` + 引用式 `blocks`，v1/v2 自动迁移，旧校验和迁移后重算）；新增 `netlab/core/model/networks.py`
    的 `NetworkContainer`（每网络独立 `Simulation`/线程/录制器，切换即暂停旧网络，未运行层不推进）；API `GET/POST
    /api/networks`、`PATCH/DELETE /api/networks/{id}`、`POST /api/networks/{id}/activate`、`POST
    /api/networks/run-all|pause-all`；工程导入会整体替换全部网络。**未做**：左侧网络栏 UI、跨层输入绑定（P1）。'
  acceptance: 两网络并存互不干扰；单层运行另一层不耗 CPU；冻结有明确标注；删除被引用网络被拒。
  weight: ⭐⭐⭐⭐⭐ / P0（数据模型）+ P1（跨层绑定 UI）
  stage: ⭐⭐⭐⭐⭐ / P0（数据模型）+ P1（跨层绑定 UI）
- id: R08
  title: 信息架构：菜单栏、侧栏、顶部信息条
  status: '**2026-10-26 外壳已落地**——8 项菜单栏（未实现项显式置灰并标注期次）、顶部信息条、左侧网络列表（切换/改名/新建/删除/收起/拖宽，接
    `/api/networks`）、右侧「节点函数」「连接函数」两个页签（按角色锁定）、「场景」改名「工程」；静态资源 `?v=2.3.0`。**未做**：菜单里的撤销/快捷键（票
    05）、分析/搜索/文档中心（P3/P5）。'
  acceptance: 原面板功能都能从菜单到达；侧栏宽度可拖且状态持久化；静态资源版本号随之 bump。
  weight: ⭐⭐⭐⭐ / P0
  stage: ⭐⭐⭐⭐ / P0
- id: R09
  title: 画布：路由、锚点、尺寸、吸附、符号与风格
  status: '**2026-10-26 首批完成**——节点 `size{w}`（24–200，端口/连线联动）、连线 `route`（auto/straight/orthogonal/manual）+
    `waypoints` + `anchors`（左右上下/自动）已进数据模型与 API；画布按路由绘制（手动路由 Alt+点击加拐点、拖圆点调整）、节点右下角尺寸手柄、网格吸附（默认
    20，Alt 临时暂停）、工程级符号风格（经典圆形 / GB 矩形首批）与 `ui.grid/symbol` 落地；检查器「几何」区可改路由/锚点/清空拐点。**未做**：GB
    符号库细化与元件图形（P4/R15）、逐边锚点拖拽手柄（当前用下拉）。'
  acceptance: 三态路由可切换且保存后一致；拖过的边不被自动算法覆盖；节点放大后连线仍贴边；GB 图形符合国标；风格切换只影响本工程。
  weight: ⭐⭐⭐⭐ / P2
  stage: ⭐⭐⭐⭐ / P2
- id: R10
  title: 选择、快捷键、撤销与剪贴板
  status: '**2026-10-26 完成基础层**——快捷键表按 D28 生效（`Ctrl+S` 保存工程、`Ctrl+Shift+E` 导出场景、`Ctrl+Alt+S`
    另存为、`Ctrl+Z`/`Ctrl+Shift+Z` 撤销重做、`Ctrl+C/X/V`、`Ctrl+A`、Delete）；多选（Ctrl+单击）与框选（Ctrl+拖框）；内部剪贴板含连接与参数、跨网络粘贴需确认；撤销
    100 步（服务端场景快照，保留当前库文件，不会复活已删库模块）。**未做**：跨工程片段文件、拖动多选整体移动。'
  acceptance: 多选/框选/复制粘贴/剪切可用且跨层提示正确；撤销 100 步内可回；撤销不复活已删库模块；重名自动加序号。
  weight: ⭐⭐⭐⭐ / P0（快捷键+选择）/ P1（剪贴板绑定提示）
  stage: ⭐⭐⭐⭐ / P0（快捷键+选择）/ P1（剪贴板绑定提示）
- id: R11
  title: 时间与循环播放
  status: '`t_step`/`zero_time` 已落地（P0）；**2026-10-26 P3 完成推荐周期**：`analysis.recommend_period`
    用录制数据 FFT 峰值 → 候选周期 → 平移一致性（MAE/σ）→ 按 score 排序并给诊断；`GET /api/analysis/period`；前端分析面板「周期」按钮。**2026-11-07
    补多窗口**：`_period_windows` 取全窗 + 前后 65%/35% 重叠子窗，逐窗算平移一致性（score/MAE），候选附 `windows`/`score_std`，结果附
    `period_std`；仍是 FFT 峰值驱动的简化五步（未做候选周期网格/自相关预处理）。'
  acceptance: 单步按 `T_step` 推进；推荐周期给依据与备选；无稳定周期如实报告；时间归零不清状态、重置清状态。
  weight: ⭐⭐⭐⭐ / P0（T_step、归零/重置）/ P3（推荐周期）
  stage: ⭐⭐⭐⭐ / P0（T_step、归零/重置）/ P3（推荐周期）
- id: R12
  title: 分析：时域/频域、指标、数学形式、CSV
  status: '**2026-10-26 P3 完成**——新增 `netlab/core/compute/analysis.py`：① 时域指标（初/终值、min/max/mean/rms、峰值时间、超调、10/90%
    上升时间、±2% 调节时间，附算法来源）；② 频谱（录制数据 FFT，去均值+Hann 窗+幅度校正，输出 freqs/magnitude/phase 与
    Top 峰值）；③ 数学形式（节点注册表公式+参数，仅呈现）；④ CSV 导出（`网络.节点.字段` 列名、`#` 元数据头、时间窗裁剪、抽稀、只写 `exports/`、同名自动加序号）；⑤
    符号传递函数（sympy 可选，gain/sum/lag/integrate+pass，忽略偏置/限幅，独立源按 0，附假设）；⑥ 前端「分析」面板（信号选择、指标/频谱/周期/数学形式/CSV、频谱图、传递函数推导、性能与单步超时）。API
    `/api/analysis/{metrics,spectrum,period,math,transfer,export}`，分析整体 5 s 超时保护。**未做**：运行点线性化的
    Bode 曲线（第二条频域路径目前是「符号传递函数」，不是幅相曲线）；时域图沿用「信号」页。'
  acceptance: 两条频域路径都带来源标注；指标可追溯到算法；sympy 未装时降级并说明；CSV 含元数据头且列名带层名。
  weight: ⭐⭐⭐ / P3
  stage: ⭐⭐⭐ / P3
- id: R13
  title: 性能与计时
  status: '`netlab/core/compute/profiling.py`（`@timed` / `measure` / 环形采样，默认关；已装饰
    `scene.step`、`network.step`、`circuit.solver.step`）；`GET /api/profile`、`PATCH /api/profile{enabled,reset}`
    可用；**性能面板与单拍超时保护已完成（P3）**：前端性能页显示 Top 表，`step_timeout_ms` 超时会中断并定位节点；离线基准仍是 `tools/bench.py`。'
  acceptance: 关闭时开销可忽略；开启能排出 Top 慢节点；超时能及时暂停并指出节点名。
  weight: ⭐⭐⭐ / P0（装饰器）/ P3（面板与保护）
  stage: ⭐⭐⭐ / P0（装饰器）/ P3（面板与保护）
- id: R14
  title: 帮助、文档与搜索
  status: 参数表单已有 `help` 文案；已有非模态文档中心（`docs/*.md` 列表 + 段落搜索 + Ctrl+K）。**2026-11-07
    补全局搜索**：`GET /api/help/search?q=&limit=` 覆盖元件、电路节点、信号节点、计算方法、模板与文档（带 kind/score/ref/line）；前端搜索框先列文档段落，再按「元件
    / 电路节点 / 计算 / 方法 / 模板 / 文档」分组显示并带类别 badge；排序按 kind 精确命中 > 前缀 > 标题 > 正文，再按类别优先级；`GET
    /api/help/doc?path=&line=` 只读渲染文档并高亮行、拒绝路径穿越。**未做**：按层限定筛选（需求/规范/历史）、术语统一表、顶部信息条。
  acceptance: 任一参数 `?` 能给四段内容并跳转实现页；文档窗口非模态；搜索可按层限定并跳转定位。
  weight: ⭐⭐⭐ / P5
  stage: ⭐⭐⭐ / P5
- id: R15
  title: 电路元件与 GB 符号
  status: '**2026-10-26 P4 批次 1–2 完成**——`element_catalog()` 共 **14 种**：原有 9 种（R/C/L/电压源/电流源/二极管/开关/VCVS/VCCS）+
    本批新增 5 种行为元件：`opamp`（tanh 平滑饱和，闭环增益/饱和有测试）、`comparator`（高增益+迟滞，双向饱和）、`zener`（正向
    PN + softplus 平滑击穿钳位，`ron` 动态电阻）、`led`（二极管电学行为）、`dflipflop`（上升沿 Q←D、单步延迟、保持）。GB
    符号：电路模式 + `ui.symbol=gb` 时按元件 kind 绘制符号（电阻锯齿、电容双板、电感弧、电压/电流源圆、二极管/稳压管/LED、开关、VCVS/VCCS
    菱形、运放/比较器三角、D 触发器矩形）；符号放大 1.6–2.4×、主题色描边、与导线同线宽且无贴图底（导线在符号处自然穿过）；**电路节点改为 CAD
    式小圆/实心点/小方框（样式可选）**，接地用标准接地符号；GB 功能节点按类型画专属符号（Σ/三角 K/∫/τ/f(x)/~/s/M/I/O/B），未知回落小圆+标签，截图
    [assets/p4-gb-symbols.png](assets/p4-gb-symbols.png)。行为测试 `test_p4_elements.py`
    6 项。**未做**：晶闸管/IGBT/JFET/继电器/电机等清单内尚未建模的功率/执行器件；第二批复用 R05 块机制的「内部电路」双模型视图；元件级
    GB 图形细化（当前为通用绘制，非标准图纸级）。'
  acceptance: 第一批有解析/行为测试；运放/比较器闭环增益与饱和符合预期；触发器真值表与边沿测试通过；每个元件有 GB 图形。
  weight: ⭐⭐⭐ / P4
  stage: ⭐⭐⭐ / P4
- id: R16
  title: 数据保护（横切）
  status: 原子写/校验和/`.bak` 已有；**快照式自动保存已落地**：`workspace.write_snapshot / prune_snapshots
    / list_snapshots / load_snapshot`（只写工程 `backups/`，命名 `snapshot-YYYYmmdd-HHMMSS-<8hex>.netlab`，保留最近
    N + 每日 1，非法 tag 白名单化）；API `POST /api/workspace/snapshot`、`GET /api/workspace/snapshots`、`POST
    /api/workspace/restore`；前端自动保存按设置间隔（默认 60 s、可关）写快照。**2026-10-26 收尾**：库文件版本不可原地改（同
    id+version 内容不同→拒绝，D10）；删除/改名/覆盖前均扫描工程引用（无引用才直接执行，有引用需显式 force）；校验报告只写 `exports/`、不覆盖正本。
