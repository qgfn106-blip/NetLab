<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="530" viewBox="0 0 1050 530" role="img" aria-labelledby="title desc">
<title id="title">从 Recorder 到分析结果</title><desc id="desc">录制帧经过对齐、重采样进入时域/频域/描述符分析，再由 API 与前端呈现。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1050" height="530" fill="#f8fafc"/>
<text x="40" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">从 Recorder 到分析结果</text>
<g font-family="sans-serif">
<rect x="40" y="105" width="210" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="145.0" y="136.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Recorder</text>
<text x="145.0" y="158.5" text-anchor="middle" font-size="14" fill="#0f172a">deque(maxlen=6000)</text>
<text x="145.0" y="176.5" text-anchor="middle" font-size="14" fill="#0f172a">最近 6000 帧</text>
<rect x="280" y="105" width="210" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="385.0" y="136.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">对齐 _series</text>
<text x="385.0" y="158.5" text-anchor="middle" font-size="14" fill="#0f172a">缺测 / NaN → NaN</text>
<text x="385.0" y="176.5" text-anchor="middle" font-size="14" fill="#0f172a">isfinite 掩码</text>
<rect x="520" y="105" width="210" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="625.0" y="136.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">重采样 _uniform</text>
<text x="625.0" y="158.5" text-anchor="middle" font-size="14" fill="#0f172a">Δt = median 正差分</text>
<text x="625.0" y="176.5" text-anchor="middle" font-size="14" fill="#0f172a">线性插值</text>
<rect x="760" y="105" width="210" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="865.0" y="136.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">分析分支</text>
<text x="865.0" y="158.5" text-anchor="middle" font-size="14" fill="#0f172a">metrics / phase</text>
<text x="865.0" y="176.5" text-anchor="middle" font-size="14" fill="#0f172a">spectrum / period</text>
<line x1="250" y1="150" x2="280" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="490" y1="150" x2="520" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="730" y1="150" x2="760" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="260" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="170.0" y="316.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">传递函数 / Bode</text>
<text x="170.0" y="338.5" text-anchor="middle" font-size="14" fill="#0f172a">signal：状态空间</text>
<text x="170.0" y="356.5" text-anchor="middle" font-size="14" fill="#0f172a">circuit：MNA 频响</text>
<rect x="330" y="280" width="260" height="100" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="3"/>
<text x="460.0" y="316.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">描述符 M0–M4</text>
<text x="460.0" y="338.5" text-anchor="middle" font-size="14" fill="#0f172a">E ẋ = A x + B u</text>
<text x="460.0" y="356.5" text-anchor="middle" font-size="14" fill="#0f172a">极点 / 零点 / 阶跃</text>
<rect x="620" y="280" width="200" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
<text x="720.0" y="316.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">API</text>
<text x="720.0" y="338.5" text-anchor="middle" font-size="14" fill="#0f172a">POST /api/analysis/tf</text>
<text x="720.0" y="356.5" text-anchor="middle" font-size="14" fill="#0f172a">mode=signal|circuit</text>
<rect x="840" y="280" width="190" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="935.0" y="316.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">前端</text>
<text x="935.0" y="338.5" text-anchor="middle" font-size="14" fill="#0f172a">ac_analysis.ts</text>
<text x="935.0" y="356.5" text-anchor="middle" font-size="14" fill="#0f172a">小信号旁路入口</text>
<text x="40" y="435" text-anchor="start" font-size="14" fill="#475569">统一频响字段：real / imag / magnitude / phase_deg / db；所有分支归约到同一口径。</text>
<text x="40" y="467" text-anchor="start" font-size="14" fill="#475569">period 由 FFT 候选峰 + 单窗平移评分 + 多窗 MAE 一致性确定，而非直接取最大峰。</text>
<text x="40" y="499" text-anchor="start" font-size="14" fill="#475569">缓冲窗口外的历史不可回读；长时分析需降采样或外接持久化。</text>
</g>
</svg>
