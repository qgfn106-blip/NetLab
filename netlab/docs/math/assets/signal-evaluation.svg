<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc">
<title id="title">信号流一拍求值</title><desc id="desc">一拍内按拓扑序求值连接方法与节点算子，延迟边使用上一拍缓存。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1040" height="460" fill="#f8fafc"/>
<text x="40" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">信号流一拍求值</text>
<g font-family="sans-serif">
<rect x="40" y="110" width="210" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="145.0" y="141.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">① 读取 D_k</text>
<text x="145.0" y="163.5" text-anchor="middle" font-size="14" fill="#0f172a">只读 source / target</text>
<text x="145.0" y="181.5" text-anchor="middle" font-size="14" fill="#0f172a">NodeView 视图</text>
<rect x="290" y="110" width="210" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="395.0" y="141.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">② 连接方法 g_e</text>
<text x="395.0" y="163.5" text-anchor="middle" font-size="14" fill="#0f172a">y_e = g_e(…)</text>
<text x="395.0" y="181.5" text-anchor="middle" font-size="14" fill="#0f172a">每边独立 Θ_e, S_e</text>
<rect x="540" y="110" width="210" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="645.0" y="141.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">③ 节点算子 f_v</text>
<text x="645.0" y="163.5" text-anchor="middle" font-size="14" fill="#0f172a">f_v(inputs, data)</text>
<text x="645.0" y="181.5" text-anchor="middle" font-size="14" fill="#0f172a">写回差分字典</text>
<rect x="790" y="110" width="210" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="895.0" y="141.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">④ 写出 D_{k+1}</text>
<text x="895.0" y="163.5" text-anchor="middle" font-size="14" fill="#0f172a">D_k ⊕ δ</text>
<text x="895.0" y="181.5" text-anchor="middle" font-size="14" fill="#0f172a">失败整步回滚</text>
<line x1="250" y1="155" x2="290" y2="155" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="500" y1="155" x2="540" y2="155" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="750" y1="155" x2="790" y2="155" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="285" text-anchor="start" font-size="14" fill="#475569">非延迟边：按拓扑序在本拍现场求值；延迟边：步首统一求值，读取上一拍 z⁻¹ 值。</text>
<text x="40" y="320" text-anchor="start" font-size="14" fill="#475569">compute 回调走深拷贝隔离；trusted handler 走浅拷贝快路径，保证语义不变。</text>
<text x="40" y="355" text-anchor="start" font-size="14" fill="#475569">同一拍内 SCC 若开启 solve_algebraic，则收缩后解代数环，否则自动提升为延迟边。</text>
</g>
</svg>
