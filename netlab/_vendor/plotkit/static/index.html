<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlotKit</title>
<link rel="stylesheet" href="static/app.css">
</head>
<body data-theme="dark">
  <header class="bar">
    <div class="brand">
      <span class="logo">◧</span>
      <span class="name">PlotKit</span>
      <span class="tag" id="specversion">spec v0.1</span>
    </div>
    <div class="title" id="figtitle">—</div>
    <nav class="menubar" id="menubar"></nav>
    <div class="actions">
      <button class="btn" id="btn-add" title="新增图层">＋ 图层</button>
      <button class="btn" id="btn-png" title="用 matplotlib 导出一张静态图">导出 PNG</button>
      <button class="btn" id="btn-anim" title="按 figure.anim 逐帧播放（再点停止）">动画</button>
      <button class="btn" id="btn-3d" title="WebGL 三维视图：拖动旋转，数据不经服务端重绘">3D</button>
      <button class="btn ghost" id="btn-theme" title="切换深浅色">◐</button>
      <button class="btn ghost" id="btn-panel" title="收起/展开右侧面板">▸</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <label class="inline" title="只显示最近 N 秒；留空 = 显示全部历史"><span>时间窗</span>
      <input id="winSec" type="number" min="0.1" step="0.5" placeholder="全部" /><em>s</em>
    </label>
    <label class="inline grow" title="拖动查看历史；播放时按速度前进">
      <span>回放</span>
      <input id="playhead" type="range" min="0" max="1000" step="1" value="1000" />
      <em id="playTime">实时</em>
    </label>
    <button class="btn ghost" id="btn-play" title="播放 / 暂停">▶</button>
    <label class="inline" title="每秒前进多少帧">
      <span>速度</span>
      <input id="playSpeed" type="range" min="5" max="240" step="5" value="60" />
      <em id="playSpeedVal">60/s</em>
    </label>
    <label class="inline"><input id="playLoop" type="checkbox" /><span>循环</span></label>
    <button class="btn ghost" id="btn-live" title="回到最新数据">回到实时</button>
    <button class="btn ghost" id="btn-clear" title="清空轨迹与数据">清空</button>
    <span id="playStatus" class="toolhint"></span>
  </div>

  <main class="stage">
    <section class="plotwrap">
      <div id="plot" class="plot">
        <img id="plotImg" alt="" draggable="false">
        <canvas id="plot3d" hidden></canvas>
        <canvas id="plot3d-deco" hidden></canvas>
        <div id="plot3d-hud" class="plot-hover" hidden></div>
        <div id="plot3d-region" class="plot-hover" hidden></div>
        <div id="plot3d-timeline" hidden>
          <button id="btn-3d-play" type="button" title="播放 / 暂停">▶</button>
          <input id="plot3d-slider" type="range" min="0" max="0" value="0" step="1" aria-label="时间轴">
          <span id="plot3d-time">0</span>
        </div>
        <div id="plotHover" class="plot-hover" hidden></div>
      </div>
      <div id="inset-overlay" class="inset-overlay" hidden></div>
      <div class="empty" id="empty" hidden>
        <p>还没有图层</p>
        <p class="hint">左侧面板选一个数据集，然后点「＋ 图层」</p>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-grip" id="panel-grip" title="拖动调宽度，双击复位"></div>

      <details class="pgroup sect" open>
        <summary><span class="sect-title">布局</span></summary>
        <div class="sect-body">
          <div class="grid2">
            <label class="field"><span>列数</span><input type="number" id="ncols" min="1" max="6" value="1"></label>
            <label class="field"><span>子图数</span><input type="number" id="subplots" min="1" max="12" value="1"></label>
            <label class="field"><span>主题</span>
              <select id="theme"><option value="default">浅色</option><option value="netlab-dark">深色</option></select>
            </label>
            <label class="field check"><span>联动 X 轴</span><input type="checkbox" id="linkx"></label>
          </div>
        </div>
      </details>

      <details class="pgroup sect dsgroup" open>
        <summary><span class="sect-title">数据集</span> <span class="count" id="dscount">0</span></summary>
        <div class="sect-body">
          <div class="dsbar">
            <input id="dsSearch" type="search" placeholder="筛选信号，例如 voltage / x / u" />
            <button class="btn ghost" id="dsAdd" title="把符合筛选条件的信号一次加成折线">全部加图层</button>
          </div>
          <div id="datasets" class="datasets"></div>
        </div>
      </details>

      <details class="pgroup sect grow" open>
        <summary><span class="sect-title">图层</span> <span class="count" id="layercount">0</span></summary>
        <div class="sect-body">
          <div id="layers" class="layers"></div>
        </div>
      </details>

      <details class="pgroup sect" id="insetgroup" hidden>
        <summary><span class="sect-title">内嵌图</span> <span class="count" id="insetcount">0</span></summary>
        <div class="sect-body">
          <div id="insets" class="layers"></div>
        </div>
      </details>

      <details class="pgroup sect">
        <summary><span class="sect-title">计时</span></summary>
        <div id="timing" class="timing"></div>
      </details>
    </aside>
  </main>

  <footer class="status">
    <span id="status">就绪</span>
    <span class="spacer"></span>
    <span id="warnings"></span>
  </footer>

  <script src="static/view3d.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
