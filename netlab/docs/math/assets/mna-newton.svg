<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">MNA 装配与 Newton 迭代</title><desc id="desc">电路每拍装配 A x = b，Newton 迭代配合 Armijo 与 gmin/source stepping。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect width="1040" height="560" fill="#f8fafc"/>
<text x="40" y="44" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">MNA 装配与 Newton 迭代</text>
<g font-family="sans-serif">
<rect x="40" y="95" width="220" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="150.0" y="126.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">A x = b 装配</text>
<text x="150.0" y="148.5" text-anchor="middle" font-size="14" fill="#0f172a">_blank_matrix 清零</text>
<text x="150.0" y="166.5" text-anchor="middle" font-size="14" fill="#0f172a">逐元件 stamp 累加</text>
<rect x="300" y="95" width="200" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="400.0" y="126.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">求解 A x = b</text>
<text x="400.0" y="148.5" text-anchor="middle" font-size="14" fill="#0f172a">稠密 LU / 稀疏 LU</text>
<text x="400.0" y="166.5" text-anchor="middle" font-size="14" fill="#0f172a">稀疏阈值 512</text>
<rect x="540" y="95" width="220" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="650.0" y="126.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">真实残差 F(x)</text>
<text x="650.0" y="148.5" text-anchor="middle" font-size="14" fill="#0f172a">_true_residual</text>
<text x="650.0" y="166.5" text-anchor="middle" font-size="14" fill="#0f172a">KCL 残差 + 归一化</text>
<rect x="800" y="95" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="900.0" y="126.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">收敛判定</text>
<text x="900.0" y="148.5" text-anchor="middle" font-size="14" fill="#0f172a">abs(x) ≤ 1e9</text>
<text x="900.0" y="166.5" text-anchor="middle" font-size="14" fill="#0f172a">残差 ≤ tol</text>
<line x1="260" y1="140" x2="300" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="500" y1="140" x2="540" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="760" y1="140" x2="800" y2="140" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="260" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="170.0" y="316.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Newton 迭代</text>
<text x="170.0" y="338.5" text-anchor="middle" font-size="14" fill="#0f172a">J(x_k) Δx_k = −F(x_k)</text>
<text x="170.0" y="356.5" text-anchor="middle" font-size="14" fill="#0f172a">x_{k+1} = x_k + α_k Δx_k</text>
<rect x="340" y="280" width="240" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="460.0" y="316.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Armijo 线搜索</text>
<text x="460.0" y="338.5" text-anchor="middle" font-size="14" fill="#0f172a">α 逐次减半</text>
<text x="460.0" y="356.5" text-anchor="middle" font-size="14" fill="#0f172a">保证残差下降</text>
<rect x="620" y="280" width="300" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="770.0" y="316.5" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">gmin / source stepping</text>
<text x="770.0" y="338.5" text-anchor="middle" font-size="14" fill="#0f172a">gmin 1e-3 逐轮递减</text>
<text x="770.0" y="356.5" text-anchor="middle" font-size="14" fill="#0f172a">源 0→1 斜坡，10 步</text>
<line x1="300" y1="330" x2="340" y2="330" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="580" y1="330" x2="620" y2="330" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="440" text-anchor="start" font-size="14" fill="#475569">非线性元件使 A、b 依赖 x；每轮先 stamp 伴随模型，再解线性方程，再算真实残差。</text>
<text x="40" y="472" text-anchor="start" font-size="14" fill="#475569">失败路径：先 gmin stepping，再 source stepping；每次试验用元件状态快照回滚。</text>
<text x="40" y="504" text-anchor="start" font-size="14" fill="#475569">瞬态积分：BE（一阶、L 稳定）/ Trap（二阶、非 L 稳定）/ Gear2（二阶、定步长）。</text>
</g>
</svg>
