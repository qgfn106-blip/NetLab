name: frontend-ts-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck (strict, no emit)
        working-directory: frontend
        run: npm run typecheck

      - name: Build (tsc-typed TS -> committed JS artifacts)
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Artifact drift guard (committed JS must match a fresh build)
        working-directory: frontend
        run: git diff --ignore-cr-at-eol --exit-code -- app.js app.utils.js desktop-shim.js
