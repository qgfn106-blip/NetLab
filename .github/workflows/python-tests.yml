name: python-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PlotKit (公开依赖)
        uses: actions/checkout@v4
        with:
          repository: qgfn106-blip/PlotKit
          path: .plotkit-src

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: netlab/requirements-dev.txt

      - name: Install
        working-directory: netlab
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ../.plotkit-src

      - name: Prepare sample projects for regression tests
        run: |
          mkdir -p MyProject
          cp netlab/tests/fixtures/projects/*.netlab MyProject/

      - name: Solver shadow gate (hard gate)
        working-directory: .
        env:
          PYTHONPATH: .
        run: python tools/solver_shadow_check.py --json

      - name: Numerical benchmarks (hard gate)
        working-directory: .
        env:
          PYTHONPATH: .
        run: pytest netlab/tests/benchmarks -q

      # 覆盖率门限（D154）：只对 core 设硬门限，server_*/desktop/vendor 不设。
      # 必须用路径形式 --cov=netlab/core：点号形式 --cov=netlab.core 会让 pytest-cov
      # 提前 import 包，触发 numpy 二次导入，sparse 组装直接 TypeError（见 LESSONS.md）。
      - name: Full Python test suite + core coverage gate
        working-directory: .
        env:
          PYTHONPATH: .
        run: >
          pytest netlab/tests -q
          --cov=netlab/core --cov-branch --cov-fail-under=80
          --cov-report=term-missing:skip-covered
          --cov-report=json:coverage.json

      # D-1：变更行覆盖率。push 用 github.event.before，PR 用 base.sha；
      # 脚本内部取 merge-base，非可执行新增行（注释/空行）不计入分母。
      - name: Changed-line coverage (D-1)
        env:
          PYTHONPATH: .
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/diff_coverage.py --coverage coverage.json --base "$DIFF_BASE" --threshold 80
